<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" width="800" height="500">
  <defs>
    <linearGradient id="sarkofagusSky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#E5ECE7"/>
      <stop offset="100%" stop-color="#CFDDD3"/>
    </linearGradient>
    <linearGradient id="stoneGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#707671"/>
      <stop offset="50%" stop-color="#555B56"/>
      <stop offset="100%" stop-color="#3A3E3B"/>
    </linearGradient>
  </defs>
  <rect width="800" height="500" fill="url(#sarkofagusSky)"/>
  <!-- Perkebunan jeruk di latar belakang -->
  <path d="M0 310 Q 250 250 500 290 T 800 270 L 800 500 L 0 500 Z" fill="#4B6E59" opacity="0.4"/>
  <path d="M0 360 C 220 330 460 350 800 340 L 800 500 L 0 500 Z" fill="#3D5A47"/>
  <!-- Canopy pohon jeruk -->
  <circle cx="100" cy="330" r="45" fill="#2E4A37"/>
  <circle cx="170" cy="320" r="40" fill="#385842"/>
  <circle cx="680" cy="320" r="50" fill="#2E4A37"/>
  <circle cx="740" cy="340" r="45" fill="#385842"/>
  <!-- Shelter / Cungkup pelindung cagar budaya -->
  <polygon points="260,180 540,180 570,220 230,220" fill="#6B4F3B"/>
  <rect x="270" y="220" width="16" height="170" fill="#543C2B"/>
  <rect x="514" y="220" width="16" height="170" fill="#543C2B"/>
  <!-- Batu Sarkofagus (Kubur Batu Megalitikum) -->
  <!-- Wadah bawah -->
  <path d="M300 320 L 500 320 L 485 390 L 315 390 Z" fill="url(#stoneGrad)"/>
  <!-- Tutup sarkofagus dengan tonjolan khas Megalitik -->
  <path d="M285 305 Q 400 270 515 305 L 505 325 L 295 325 Z" fill="#828883"/>
  <circle cx="400" cy="285" r="12" fill="#555B56"/>
  <!-- Tekstur relief batu purbakala -->
  <line x1="330" y1="340" x2="350" y2="370" stroke="#2B2D2B" stroke-width="2"/>
  <line x1="430" y1="335" x2="445" y2="365" stroke="#2B2D2B" stroke-width="2"/>
  <line x1="380" y1="350" x2="410" y2="355" stroke="#2B2D2B" stroke-width="2"/>
  <!-- Badge Label: Transparan & Faktual -->
  <rect x="25" y="25" width="460" height="42" rx="8" fill="#1C382B" opacity="0.9"/>
  <circle cx="45" cy="46" r="6" fill="#C87D55"/>
  <text x="60" y="51" font-family="system-ui, sans-serif" font-size="14" font-weight="600" fill="#FFFFFF">Situs Cagar Budaya Sarkofagus Margatengah</text>
  <rect x="25" y="445" width="460" height="32" rx="6" fill="#000000" opacity="0.65"/>
  <text x="35" y="466" font-family="system-ui, sans-serif" font-size="12" fill="#FFFFFF">Prakiraan Ilustrasi • Foto Asli Menunggu Dokumentasi Lapangan KKN</text>
</svg>
