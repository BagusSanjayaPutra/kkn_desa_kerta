<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" width="800" height="500">
  <defs>
    <linearGradient id="skyGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#DEE9E2"/>
      <stop offset="100%" stop-color="#C5D9CE"/>
    </linearGradient>
    <linearGradient id="cliffGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#415248"/>
      <stop offset="100%" stop-color="#232E27"/>
    </linearGradient>
    <linearGradient id="foliageGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#3D684E"/>
      <stop offset="100%" stop-color="#224230"/>
    </linearGradient>
  </defs>
  <!-- Background sky -->
  <rect width="800" height="500" fill="url(#skyGrad)"/>
  <!-- Distant hills -->
  <path d="M0 320 Q 200 240 450 280 T 800 260 L 800 500 L 0 500 Z" fill="#698A77" opacity="0.4"/>
  <path d="M0 340 Q 300 270 580 320 T 800 310 L 800 500 L 0 500 Z" fill="#4B6E59" opacity="0.6"/>
  <!-- Cliff & Valley -->
  <path d="M0 260 C 140 260 160 380 280 400 C 400 420 500 370 650 390 L 800 360 L 800 500 L 0 500 Z" fill="url(#cliffGrad)"/>
  <!-- Giant Tree Trunk & Roots (Pohon Taep) -->
  <path d="M80 120 Q 110 260 140 380 Q 100 440 20 500 L 180 500 Q 190 420 160 340 Q 140 240 160 120 Z" fill="#2E2319"/>
  <!-- Spreading Roots on Cliff -->
  <path d="M140 340 Q 220 370 290 390 Q 340 400 380 430" stroke="#4A3B2C" stroke-width="14" stroke-linecap="round" fill="none"/>
  <path d="M150 360 Q 240 410 320 440" stroke="#3D2E20" stroke-width="9" stroke-linecap="round" fill="none"/>
  <path d="M120 380 Q 180 450 220 490" stroke="#4A3B2C" stroke-width="11" stroke-linecap="round" fill="none"/>
  <path d="M160 310 Q 260 320 350 360" stroke="#352619" stroke-width="8" stroke-linecap="round" fill="none"/>
  <!-- Foliage Canopies -->
  <circle cx="120" cy="110" r="90" fill="url(#foliageGrad)"/>
  <circle cx="190" cy="90" r="80" fill="#477359"/>
  <circle cx="60" cy="140" r="70" fill="#2B4D39"/>
  <circle cx="700" cy="380" r="110" fill="#3D684E" opacity="0.8"/>
  <circle cx="760" cy="350" r="80" fill="#477359" opacity="0.8"/>
  <!-- Bamboo bridge outline -->
  <path d="M260 420 Q 380 410 500 430" stroke="#C49B5A" stroke-width="8" stroke-linecap="round" fill="none"/>
  <path d="M260 405 Q 380 395 500 415" stroke="#D9B273" stroke-width="4" stroke-linecap="round" fill="none"/>
  <line x1="300" y1="400" x2="300" y2="425" stroke="#A88243" stroke-width="3"/>
  <line x1="360" y1="395" x2="360" y2="420" stroke="#A88243" stroke-width="3"/>
  <line x1="420" y1="398" x2="420" y2="422" stroke="#A88243" stroke-width="3"/>
  <!-- Badge Label: Transparan & Faktual -->
  <rect x="25" y="25" width="410" height="42" rx="8" fill="#1C382B" opacity="0.9"/>
  <circle cx="45" cy="46" r="6" fill="#E2B15B"/>
  <text x="60" y="51" font-family="system-ui, sans-serif" font-size="14" font-weight="600" fill="#FFFFFF">Objek Wisata Alam Munduk Asri</text>
  <rect x="25" y="445" width="460" height="32" rx="6" fill="#000000" opacity="0.65"/>
  <text x="35" y="466" font-family="system-ui, sans-serif" font-size="12" fill="#FFFFFF">Prakiraan Ilustrasi • Foto Asli Menunggu Dokumentasi Lapangan KKN</text>
</svg>
