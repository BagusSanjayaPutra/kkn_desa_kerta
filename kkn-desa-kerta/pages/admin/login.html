<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Login Administrator CMS — Jelajah Desa Kerta</title>
  
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet" />

  <link rel="stylesheet" href="/assets/css/admin.css" />
  <style>
    body.login-body {
      background: linear-gradient(135deg, #14281E 0%, #1C382B 50%, #2D5A43 100%);
      display: flex;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      padding: 1.5rem;
    }
    .login-card {
      background: #FFFFFF;
      width: 100%;
      max-width: 420px;
      border-radius: 16px;
      padding: 2.5rem 2rem;
      box-shadow: 0 20px 40px rgba(0,0,0,0.25);
    }
    .login-header {
      text-align: center;
      margin-bottom: 2rem;
    }
    .login-logo {
      height: 48px;
      margin: 0 auto 1rem;
    }
    .login-title {
      font-size: 1.35rem;
      font-weight: 800;
      color: #1C382B;
    }
    .login-subtitle {
      font-size: 0.8125rem;
      color: #5A6D63;
      margin-top: 0.25rem;
    }
    .login-alert {
      display: none;
      background: #FFEBEE;
      color: #C62828;
      border: 1px solid #FFCDD2;
      border-radius: 6px;
      padding: 0.65rem 0.9rem;
      font-size: 0.8125rem;
      margin-bottom: 1.25rem;
    }
  </style>
</head>
<body class="login-body">

  <div class="login-card">
    <div class="login-header">
      <img src="/assets/images/brand/logo.svg" alt="Logo Desa Kerta" class="login-logo" />
      <h1 class="login-title">Admin Dashboard CMS</h1>
      <p class="login-subtitle">Pengelolaan Informasi Wisata Desa Kerta, Payangan</p>
    </div>

    <div class="login-alert" id="login-alert" role="alert"></div>

    <form id="admin-login-form">
      <div class="form-group">
        <label for="login-username" class="form-label">Nama Pengguna (Username)</label>
        <input 
          type="text" 
          id="login-username" 
          class="form-control" 
          required 
          autocomplete="username"
          placeholder="Masukkan username admin"
        />
      </div>

      <div class="form-group">
        <label for="login-password" class="form-label">Kata Sandi (Password)</label>
        <input 
          type="password" 
          id="login-password" 
          class="form-control" 
          required 
          autocomplete="current-password"
          placeholder="••••••••••••"
        />
      </div>

      <button type="submit" class="btn-admin btn-admin-primary" style="width:100%; padding:0.75rem; margin-top:0.5rem; font-size:0.9375rem;">
        Masuk ke Dashboard
      </button>
    </form>

    <div style="margin-top:1.75rem; text-align:center; font-size:0.8125rem; border-top:1px solid #EDF2EE; padding-top:1.25rem;">
      <a href="/" style="color:#5A6D63; text-decoration:none;">&larr; Kembali ke Website Publik</a>
      <div style="margin-top:0.5rem; color:#879B90; font-size:0.75rem;">
        Sistem Terproteksi PBKDF2 Token Authentication
      </div>
    </div>
  </div>

  <script src="/assets/js/admin-api.js"></script>
  <script src="/assets/js/admin-auth.js"></script>
</body>
</html>
